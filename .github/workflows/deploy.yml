
name: React - Build y Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-produccion
  cancel-in-progress: false

jobs:
  build:
    name: Compilar React
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar React
        run: npm run build

      - name: Guardar archivos compilados
        uses: actions/upload-artifact@v4
        with:
          name: react-dist
          path: dist/
          if-no-files-found: error

  deploy:
    name: Publicar en Nginx
    needs: build
    runs-on: [self-hosted, Linux, X64, react-deploy]

    steps:
      - name: Descargar archivos compilados
        uses: actions/download-artifact@v4
        with:
          name: react-dist
          path: ${{ runner.temp }}/react-dist

      - name: Verificar compilacion
        run: test -f "$RUNNER_TEMP/react-dist/index.html"

      - name: Publicar React
        run: |
          DESTINO="/home/octam/homelab/web-publica/react"
          mkdir -p "$DESTINO"
          cp -a "$RUNNER_TEMP/react-dist/." "$DESTINO/"
          echo "React publicado correctamente"

      - name: Comprobar pagina
        run: |
          curl --fail --silent --show-error \
            http://127.0.0.1:8081/react/ > /dev/null
          echo "Pagina web disponible"
